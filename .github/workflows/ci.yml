name: CI

# Vérifications rapides à chaque push sur main et à chaque pull request : formatage, lint,
# tests Rust (dont les dépôts git fixtures), typecheck et tests du front, build du front.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Vérifications
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Dépendances système de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cohérence des versions
        run: node scripts/check-version.mjs

      - run: npm ci

      - name: Front — typecheck
        run: npm run typecheck

      - name: Front — tests
        run: npm test

      - name: Front — build
        # Le crate Tauri embarque dist/ à la compilation : il doit exister avant clippy et les tests.
        run: npx vite build

      - name: Rust — formatage
        run: cargo fmt --all --check

      - name: Rust — clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust — tests
        run: cargo test --workspace
