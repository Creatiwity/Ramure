[workspace]
resolver = "3"
members = ["crates/ramure-core", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Creatiwity/ramure"
rust-version = "1.94"

[workspace.dependencies]
gix = { version = "0.87.1", default-features = false, features = ["sha1", "revision", "max-performance-safe", "parallel"] }
nucleo-matcher = "0.3.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
notify = "8.2.0"
tempfile = "3.27.0"
tauri = { version = "2.11.6", features = [] }
tauri-build = { version = "2.6.3", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.12.0"

[profile.release]
lto = "thin"
codegen-units = 1
